name: Skill package validation

on:
  push:
    branches: [master]
    paths:
      - 'SKILL.md'
      - 'WORKFLOW.md'
      - 'OUTPUT-FORMAT.md'
      - 'CHECKLIST.md'
      - 'EXAMPLES.md'
      - 'CROSS-PLATFORM.md'
      - 'MOBILE-WORKFLOW.md'
      - 'MOBILE-PARITY-TEST.md'
      - '大展宏图方法论.md'
      - 'references/**'
      - 'outputs/**/*.md'
      - 'mobile/**'
      - 'releases/**'
      - 'agents/**'
      - 'VERSION'
      - 'delivery-pack/**'
      - 'delivery-pack/scripts/build_mobile_pack.py'
      - 'delivery-pack/scripts/build_skill_package.py'
      - 'delivery-pack/requirements-cloud.txt'
      - 'tests/**'
      - '.github/workflows/validate-skill.yml'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'WORKFLOW.md'
      - 'OUTPUT-FORMAT.md'
      - 'CHECKLIST.md'
      - 'EXAMPLES.md'
      - 'CROSS-PLATFORM.md'
      - 'MOBILE-WORKFLOW.md'
      - 'MOBILE-PARITY-TEST.md'
      - '大展宏图方法论.md'
      - 'references/**'
      - 'outputs/**/*.md'
      - 'mobile/**'
      - 'releases/**'
      - 'agents/**'
      - 'VERSION'
      - 'delivery-pack/**'
      - 'delivery-pack/scripts/build_mobile_pack.py'
      - 'delivery-pack/scripts/build_skill_package.py'
      - 'delivery-pack/requirements-cloud.txt'
      - 'tests/**'
      - '.github/workflows/validate-skill.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r delivery-pack/requirements-cloud.txt
      - name: Check generated mobile pack
        run: python delivery-pack/scripts/build_mobile_pack.py --check
      - name: Check portable Skill package
        run: python delivery-pack/scripts/build_skill_package.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
